# Build de Railway. Sin módulos nativos ya no hace falta Dockerfile: Nixpacks
# detecta Node por package.json y arma la imagen solo.
#
# Lo único que hay que agregarle es el cliente de Postgres, para que exista el
# binario `pg_dump` que usa el backup a R2 (src/backup.js). El `"..."` conserva
# los paquetes que Nixpacks pone por default (Node, npm).
#
# OJO con la versión: pg_dump se niega a volcar una base de un server MÁS NUEVO
# que él ("aborting because of server version mismatch"). Railway provisiona
# hoy `postgres-ssl:18`, así que acá va 18. Si algún día la base sube de
# versión, subir esto también.
#
# Si se desincroniza no es una urgencia: el backup detecta el fallo de pg_dump
# y cae solo al volcado JSON de la tabla `docs` (ver src/backup.js), avisando
# con un `warn` en el log. Sigue habiendo backup, en otro formato.
[phases.setup]
nixPkgs = ["...", "postgresql_18"]
